[project]
name = "mlops-project"
version = "0.1.0"
description = "MLOps HS26 semester project"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "mlflow>=2.16",
    "python-dotenv>=1.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
serve = ["fastapi>=0.115", "uvicorn>=0.32"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlops_project"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
