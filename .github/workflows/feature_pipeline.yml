# Scheduled feature pipeline — the MS2 deliverable requires scheduled, NOT manual, execution.
#
# Two things to know before relying on this:
#  1. GitHub's cron is best-effort. Runs are delayed or SKIPPED under load, especially
#     on the hour. Never assume "one run per interval" — the course's own peer-review
#     example is literally a project whose lag features broke because cron skipped runs.
#     Make the pipeline idempotent and time-based, never row-position-based.
#  2. Scheduled workflows are disabled automatically after 60 days of repository
#     inactivity. Over a semester break that will silently stop your ingestion.

name: Feature pipeline

on:
  schedule:
    - cron: "7 * * * *"   # hourly at :07 — off-the-hour to dodge the peak-load skip window
  workflow_dispatch:
    inputs:
      backfill_start:
        description: "Backfill start (YYYY-MM-DD). Leave empty for a normal incremental run."
        required: false
        type: string
      backfill_end:
        description: "Backfill end (YYYY-MM-DD)."
        required: false
        type: string

concurrency:
  group: feature-pipeline          # never let two ingests race on the feature store
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run feature pipeline
        env:
          SOURCE_API_KEY: ${{ secrets.SOURCE_API_KEY }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
        run: |
          if [ -n "${{ inputs.backfill_start }}" ]; then
            uv run python -m mlops_project.features.backfill \
              --start "${{ inputs.backfill_start }}" \
              --end "${{ inputs.backfill_end }}"
          else
            uv run python -m mlops_project.features.run
          fi
