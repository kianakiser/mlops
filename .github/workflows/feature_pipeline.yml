# Scheduled feature pipeline — the MS2 deliverable requires scheduled, NOT manual, execution.
#
# Two things to know before relying on this:
#  1. GitHub's cron is best-effort. Runs are delayed or SKIPPED under load, especially
#     on the hour. Never assume "one run per interval" — the course's own peer-review
#     example is literally a project whose lag features broke because cron skipped runs.
#     Make the pipeline idempotent and time-based, never row-position-based.
#     Here that is cheap: events are immutable once finished and are fetched by id, so a
#     skipped run is repaired by the next one with no gap and no special-casing.
#  2. Scheduled workflows are disabled automatically after 60 days of repository
#     inactivity. Over a semester break that will silently stop your ingestion.

name: Feature pipeline

on:
  schedule:
    # DAILY, not hourly. The source publishes roughly 0.5 events per day (193 events over the
    # 14-month backfill) and a finished event is immutable, so hourly polling would issue ~24x
    # the requests for the same rows against a keyless community API with a documented budget of
    # 50 requests / 5 minutes. 06:07 UTC sits after the evening events have closed; the :07 is to
    # stay off the top of the hour, where GitHub is most likely to skip a scheduled run.
    - cron: "7 6 * * *"
  workflow_dispatch:
    inputs:
      backfill_start:
        description: "Any value here widens the index scan to backfill history."
        required: false
        type: string
      min_players:
        description: "Minimum event size to ingest (default 32; lowering it reduces single-organiser concentration)."
        required: false
        default: "32"
        type: string

concurrency:
  group: feature-pipeline          # never let two ingests race on the feature store
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run feature pipeline
        # No secrets here on purpose: the tournament endpoints this stage uses are keyless,
        # so a scheduled run needs no credentials at all. Requiring one would make the job
        # fail for no reason. HOPSWORKS_* arrive when the feature-store write lands (MS2).
        run: |
          if [ -n "${{ inputs.backfill_start }}" ]; then
            uv run python -m optcg_forecast.features.run \
              --limit 400 --min-players "${{ inputs.min_players || 32 }}"
          else
            uv run python -m optcg_forecast.features.run \
              --min-players "${{ inputs.min_players || 32 }}"
          fi
